name: Upload artifact to R2
description: >-
  Upload a build artifact to the shared Cloudflare R2 bucket instead of GitHub
  artifact storage, and add a presigned download link to the job summary.
inputs:
  name:
    description: Artifact name. 1-128 letters, numbers, dots, underscores, or hyphens.
    required: true
  path:
    description: File, directory, or glob to upload.
    required: true
  if-no-files-found:
    description: Behaviour when the path matches nothing. One of warn, error, ignore.
    required: false
    default: warn
  key-prefix:
    description: >-
      Replace the repository segment of the object key, giving this artifact its
      own bucket-lifecycle prefix. Same character rules as name. Defaults to the
      repository name. A consumer must pass the matching run-prefix to download.
    required: false
  link-expiry-seconds:
    description: Presigned link lifetime. Capped at 604800 (7 days) by SigV4.
    required: false
    default: "604800"
  presigned-upload-token:
    description: >-
      Base64url token from presign-upload. When set with expected-object-key,
      this action uploads without R2 credentials.
    required: false
  expected-object-key:
    description: Exact object key from presign-upload. Required with presigned-upload-token.
    required: false
outputs:
  object-key:
    description: Key of the uploaded object in the bucket.
  url:
    description: Presigned download URL.
  size:
    description: Uploaded size in bytes.
runs:
  using: node24
  main: dist/index.js
